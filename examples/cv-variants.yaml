# yaml-language-server: $schema=https://raw.githubusercontent.com/rezelute/launchfolio-docs/main/schemas/cv-variants.json

- id: cv-fullstack
  title: Full Stack Engineer
  tagline: "Full stack engineer across Vue, Nuxt, Node, and Postgres"
  summary: "Full stack engineer with 10+ years of experience building production web applications across the whole stack. Strong frontend bias with solid backend experience in Node and Postgres."
  sections:
    - summary
    - projects:
        include: [my-portfolio, charity-dashboard]
    - experience:
        # A plain id shows all highlights; a list shows only those, in order
        include:
          - acme-corp
          - career-break-2025
    - education

- id: cv-frontend
  # Hidden from the footer, but still reachable at /cv/cv-frontend
  listed: false
  title: Frontend Engineer
  tagline: "Vue/Nuxt specialist focused on performance and accessibility"
  summary: "Frontend engineer specialising in Vue 3 and Nuxt, with a track record of building performant, accessible UIs and design systems."
  sections:
    - summary
    - projects:
        include:
          - my-portfolio
          - charity-dashboard: [accessibility]
    - experience:
        include:
          - acme-corp: [dashboard-rebuild, component-library]
          - career-break-2025
    - education
